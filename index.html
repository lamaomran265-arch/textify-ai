<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Textify AI - استخراج النصوص وتوليد الفيديو</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background-color: #1e293b;
            color: white;
            padding: 1.5rem;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        main {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
            width: 100%;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        h2 {
            margin-bottom: 1rem;
            color: #1e293b;
        }
        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            margin-bottom: 1rem;
            resize: vertical;
        }
        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        footer {
            margin-top: auto;
            text-align: center;
            padding: 1rem;
            background-color: #e2e8f0;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Textify AI</h1>
        <p>استخراج النصوص وتوليد المحتوى بالذكاء الاصطناعي</p>
    </header>

    <main>
        <!-- قسم استخراج النص -->
        <div class="card">
            <h2>استخراج النص من الصورة (OCR)</h2>
            <input type="file" id="imageInput" accept="image/*" style="margin-bottom: 1rem;">
            <button onclick="extractText()">استخراج النص</button>
            <textarea id="extractedText" placeholder="النص المستخرج سيظهر هنا..."></textarea>
        </div>

        <!-- قسم صانع الفيديو بالذكاء الاصطناعي -->
        <div class="card">
            <h2>توليد فيديو بالذكاء الاصطناعي (صوت وصورة)</h2>
            <p style="margin-bottom: 1rem; font-size: 0.9rem; color: #64748b;">
                اكتبي وصف المشهد أو السكريبت، وسيتم تجهيز الفيديو لاستخدامه في اليوتيوب أو منصات التواصل.
            </p>
            <textarea id="videoPrompt" placeholder="اكتبي وصف الفيديو هنا (مثال: فيديو تعليمي للأطفال عن الفضاء مع صوت راوي)..."></textarea>
            <button onclick="generateVideo()">توليد الفيديو</button>
            <div id="videoStatus" style="margin-top: 1rem; font-weight: bold;"></div>
        </div>
    </main>

    <footer>
        <p>© 2026 Textify AI - جميع الحقوق محفوظة</p>
    </footer>

    <script>
        function extractText() {
            document.getElementById('extractedText').value = "جاري معالجة الصورة واستخراج النص...";
            setTimeout(() => {
                document.getElementById('extractedText').value = "تم استخراج النص بنجاح من الصورة!";
            }, 1500);
        }

        function generateVideo() {
            const prompt = document.getElementById('videoPrompt').value;
            const status = document.getElementById('videoStatus');
            if(!prompt) {
                status.style.color = "red";
                status.innerText = "يرجى كتابة وصف الفيديو أولاً!";
                return;
            }
            status.style.color = "#2563eb";
            status.innerText = "جاري معالجة السكريبت وتوليد المشاهد الصوتية والمرئية...";
        }
    </script>

</body>
</html>
