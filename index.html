<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Text Extractor - Free Online OCR</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #f4f7f6; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 500px; width: 100%; text-align: center; }
    h1 { color: #333; font-size: 24px; margin-bottom: 10px; }
    p { color: #666; font-size: 14px; margin-bottom: 20px; }
    input[type="file"] { margin: 15px 0; width: 100%; }
    button { background-color: #007bff; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-size: 16px; width: 100%; font-weight: bold; }
    button:hover { background-color: #0056b3; }
    #status { margin-top: 15px; font-weight: 500; color: #444; }
    textarea { width: 100%; height: 150px; margin-top: 15px; padding: 10px; border: 1px solid #ccc; border-radius: 6px; resize: vertical; }
  </style>
</head>
<body>

  <div class="card">
    <h1>AI Text Extractor</h1>
    <p>Upload an image to extract text instantly</p>
    
    <input type="file" id="imageInput" accept="image/*">
    <button onclick="extractText()">Extract Text</button>
    
    <div id="status"></div>
    <textarea id="resultText" placeholder="Extracted text will appear here..." readonly></textarea>
  </div>

  <script>
    async function extractText() {
      const fileInput = document.getElementById('imageInput');
      const status = document.getElementById('status');
      const resultText = document.getElementById('resultText');

      if (fileInput.files.length === 0) {
        alert('Please select an image first!');
        return;
      }

      const file = fileInput.files[0];
      status.innerText = 'Processing image... Please wait.';
      resultText.value = '';

      try {
        const worker = await Tesseract.createWorker('eng');
        const ret = await worker.recognize(file);
        resultText.value = ret.data.text;
        status.innerText = 'Done!';
        await worker.terminate();
      } catch (error) {
        status.innerText = 'Error processing image.';
        console.error(error);
      }
    }
  </script>

</body>
</html>
